# Base compose file: CPU-safe, runs anywhere Docker runs (no GPU required).
# On the CUDA host, layer docker-compose.gpu.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# VERSION drives both the image tags below and the APP_VERSION env var
# (read by GET /api/version and logged at worker startup) - it's exported
# from the repo-root VERSION file by scripts/build.*/stack.*, not
# duplicated into .env, so there's one source of truth. Falls back to
# "latest"/"0.0.0-dev" if VERSION isn't set (e.g. invoking docker compose
# directly instead of through the scripts).
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: api
    image: scribe-cast-api:${VERSION:-latest}
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${VERSION:-0.0.0-dev}
    volumes:
      - ./logs:/app/logs
      - uploads_data:/app/uploads
      - results_data:/app/results
      - ${DATA_DIR:-./data}:/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    image: scribe-cast-worker:${VERSION:-latest}
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${VERSION:-0.0.0-dev}
      DEVICE: ${DEVICE:-auto}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-}
      # whisperx's Silero VAD and wav2vec2 alignment models download via
      # torch.hub, which defaults to ~/.cache/torch - outside the
      # model_cache volume below, so they'd re-download on every container
      # recreate without this.
      TORCH_HOME: /app/model_cache/torch
    volumes:
      - ./logs:/app/logs
      - uploads_data:/app/uploads
      - results_data:/app/results
      - model_cache:/app/model_cache
      - ${DATA_DIR:-./data}:/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: scribe-cast-frontend:${VERSION:-latest}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads_data:
  results_data:
  model_cache:
