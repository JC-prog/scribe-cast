server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Same-origin proxy to the api service: matches the /api/* relative
    # calls used by src/api/client.ts, so the app hits the same paths in
    # `npm run dev` (proxied by vite.config.ts) and in this Dockerized build.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Video uploads can be large; don't buffer the whole body in nginx
        # before forwarding, and allow slow transcription jobs to keep polling.
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 300s;
    }
}
